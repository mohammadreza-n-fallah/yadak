# Nginx site for the osh shop (single domain).
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/osh
#   sudo ln -s /etc/nginx/sites-available/osh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with: sudo certbot --nginx -d example.com -d www.example.com
#
# Replace example.com and __USER__ below.

server {
    listen 80;
    server_name example.com www.example.com;

    # Allow product/banner image uploads from the admin panel
    client_max_body_size 20M;

    # ── Django REST API ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django admin site ────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django static (admin/DRF assets via collectstatic) ───────
    location /static/ {
        alias /home/__USER__/osh/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # ── User-uploaded media (product/banner images) ──────────────
    location /media/ {
        alias /home/__USER__/osh/backend/media/;
        access_log off;
        expires 30d;
    }

    # ── Next.js frontend (everything else, incl. /_next/ assets) ─
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
